[package]
name = "wi-api"
version = "0.1.1"
edition = "2021"
description = "Official Rust SDK for the wi-api WhatsApp platform"
license = "MIT"
repository = "https://github.com/wiApi/rust"
homepage = "https://docs.wi.api.br"
documentation = "https://docs.rs/wi-api"
keywords = ["whatsapp", "api", "sdk", "messaging"]
categories = ["api-bindings", "web-programming::http-client"]
rust-version = "1.75"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
bytes = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "macros"] }
wiremock = "0.6"

[features]
default = []
tokio = ["dep:tokio"]
